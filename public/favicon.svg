<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente do arco superior (verde para azul) -->
    <linearGradient id="fav-top-arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="60%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>

    <!-- Gradiente do swoosh inferior (azul marinho para verde esmeralda) -->
    <linearGradient id="fav-bot-swash" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A1E3F" />
      <stop offset="45%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#22A63E" />
    </linearGradient>

    <!-- Gradiente suave da letra B -->
    <linearGradient id="fav-b-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
  </defs>

  <!-- Fundo branco suave arredondado para contraste perfeito em qualquer navegador/aba (dark ou light) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Arco/Swash Superior Direito (Verde → Azul) fiel à marca -->
  <path
    d="M 33 11 C 41 7, 53 8, 59 13 C 54 11, 44 10, 36 13 Z"
    fill="url(#fav-top-arc)"
  />
  <path
    d="M 39 15 C 45 12, 53 13, 58 17 C 53 15, 46 15, 41 16.5 Z"
    fill="#1976D2"
    opacity="0.9"
  />

  <!-- Letra "B" Oficial Borlim em Azul Royal (#1565C0) -->
  <text
    x="18"
    y="44"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="900"
    letter-spacing="-1"
    fill="url(#fav-b-grad)"
  >B</text>

  <!-- Swoosh Duplo Inferior Esquerdo (Azul-Marinho → Verde Esmeralda) fiel à marca -->
  <path
    d="M 6 44 C 7 53, 14 57, 24 55 C 30 54, 35 48, 38 44 C 33 49, 27 52, 21 52 C 14 52, 10 48, 9 44 Z"
    fill="url(#fav-bot-swash)"
  />
  <path
    d="M 12 44 C 13 50, 18 53, 26 51 C 32 49, 36 44, 40 40 C 35 45, 29 48, 23 48 C 17 48, 14 45, 13 44 Z"
    fill="#22A63E"
  />
</svg>
