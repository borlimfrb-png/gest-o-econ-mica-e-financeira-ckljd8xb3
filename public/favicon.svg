<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="borlim-fav-bg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1F3A" />
      <stop offset="50%" stop-color="#0E284E" />
      <stop offset="100%" stop-color="#143A6E" />
    </linearGradient>
    <linearGradient id="borlim-fav-accent" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="borlim-fav-gold" x1="28" y1="20" x2="48" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Base arredondada moderna -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#borlim-fav-bg)" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Monograma B Estilizado com Elemento de Crescimento Financeiro -->
  <!-- Coluna esquerda firme do B -->
  <rect x="15" y="14" width="7" height="36" rx="3.5" fill="url(#borlim-fav-accent)" />

  <!-- Barra horizontal superior conectando ao arco -->
  <path d="M19 14 H35 C41 14 45.5 17.5 45.5 23 C45.5 28 41.5 31.5 36 32 H19 Z" fill="url(#borlim-fav-gold)" />
  <path d="M22 18.5 H34 C37.5 18.5 40.5 20 40.5 23 C40.5 26 37.5 27.5 34 27.5 H22 Z" fill="#0B1F3A" />

  <!-- Arco inferior com dinâmica de crescimento / expansão -->
  <path d="M19 30 H37 C43.5 30 48.5 34 48.5 40.5 C48.5 47 43.5 50 36 50 H19 Z" fill="url(#borlim-fav-accent)" />
  <path d="M22 34.5 H35.5 C39.5 34.5 43 36.8 43 40.5 C43 44.2 39.5 45.5 35.5 45.5 H22 Z" fill="#0B1F3A" />

  <!-- Vetor dinâmico ascendente / indicador de crescimento na base do B -->
  <circle cx="49" cy="17" r="3" fill="#38BDF8" />
  <path d="M42 22 L48 18" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
</svg>
